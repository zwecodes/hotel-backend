name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hotel_system_test
          MYSQL_USER: hotel
          MYSQL_PASSWORD: hotel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-do-not-use-in-prod-32chars
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: hotel
      DB_PASSWORD: hotel
      DB_NAME: hotel_system_test
      DB_SSL: "false"
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_test_secret_for_unit_tests_only
      STRIPE_CURRENCY: thb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
